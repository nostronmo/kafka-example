[tools]
maven = "latest"

[env]
_.file = ".env"

[tasks.test]
alias = "qa"
description = "Run Test"
run = "mvn clean test"

[tasks.build]
alias = "qs"
description = "Build the Project Image"
run = "mvn clean package -DskipTests"

[tasks.run]
alias = "qw"
description = "Run Spring App"
run = "mvn clean spring-boot:run"

[tasks.docker_run]
hide = true

[tasks.docker_stop]
hide = true
